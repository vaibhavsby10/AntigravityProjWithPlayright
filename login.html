<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background: #1d4ed8;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .error-message {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: center;
    }

    .credential-hint {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }

    .credential-hint code {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to continue to your dashboard</p>
    </div>

    <!-- Error message alert -->
    <div id="errorMessage" class="error-message">
      Invalid User ID or Password. Please try again.
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="username">User ID</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter User ID" 
          required 
          autocomplete="off" 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter password" 
          required 
        />
      </div>

      <button type="submit" class="btn-login" id="loginButton">Log In</button>
    </form>

    <div class="credential-hint">
      Default Credentials:<br />
      User ID: <code>admin</code> | Password: <code>admin</code>
    </div>
  </div>

  <script>
    // Redirect immediately to index.html if already logged in
    if (sessionStorage.getItem('currentUser')) {
      window.location.href = 'index.html';
    }

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault(); // Prevent standard page reload

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      // Check default credentials
      const DEFAULT_USER_ID = 'admin';
      const DEFAULT_PASSWORD = 'admin';

      if (usernameInput === DEFAULT_USER_ID && passwordInput === DEFAULT_PASSWORD) {
        // Hide error message if visible
        errorMessage.style.display = 'none';

        // Store user in session
        sessionStorage.setItem('currentUser', usernameInput);

        // Redirect to index.html
        window.location.href = 'index.html';
      } else {
        // Show invalid credentials error
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
